apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true                        # Block until healthy so downstream layers do not race CRD installs.
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/overlays/home
