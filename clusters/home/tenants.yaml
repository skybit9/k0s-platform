apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  interval: 1m                      # Low interval: a merged tenant PR lands fast. Self service feels immediate.
  prune: true
  wait: true
  dependsOn:
    - name: policies                # Guardrails and generate rules exist before any tenant is created.
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./tenants
