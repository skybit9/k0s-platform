apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "65.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    prometheus:
      prometheusSpec:
        # Empty selectors mean: discover rules and monitors in EVERY namespace, including tenant ones.
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        retention: 15d
        enableRemoteWriteReceiver: true    # OTel Collector pushes here via prometheusremotewrite exporter.
    alertmanager:
      alertmanagerSpec:
        # THIS is what makes per team alert routing work. Alertmanager merges any AlertmanagerConfig
        # carrying this label, from any namespace, into its running config.
        alertmanagerConfigSelector:
          matchLabels:
            alertmanager-config: enabled
        alertmanagerConfigMatcherStrategy:
          type: OnNamespace          # Operator auto injects a namespace matcher. Team routes cannot capture other teams' alerts.
      config:
        route:
          group_by: ["alertname", "team"]
          receiver: "platform-default"
          routes:
            - receiver: "platform-default"
              matchers:
                - severity = "critical"
                - team = "platform"
        receivers:
          - name: "platform-default"
    grafana:
      enabled: true
      defaultDashboardsEnabled: true
